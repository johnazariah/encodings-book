name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc + LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            lmodern \
            librsvg2-bin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli

      - name: Build PDF (full manuscript)
        run: make

      - name: Build PDF (sample)
        run: make sample

      - name: Build EPUB
        run: make epub

      - name: Package labs
        run: |
          tar czf labs-${{ github.ref_name }}.tar.gz \
            labs/ code/ scripts/ README.md LICENSE-CODE MANUSCRIPT-RIGHTS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manuscript/molecules-to-circuits.pdf
            manuscript/molecules-to-circuits-sample.pdf
            manuscript/molecules-to-circuits.epub
            labs-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
