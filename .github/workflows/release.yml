name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, buildbeast, podman, ci]
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc + LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra lmodern texlive-fonts-recommended

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mermaid-cli + Playwright
        run: |
          sudo npm install -g @mermaid-js/mermaid-cli
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build manuscript
        run: make

      - name: Build sample
        run: make sample

      - name: Package labs
        run: tar czf labs-${{ github.ref_name }}.tar.gz labs/ code/ README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manuscript/manuscript.pdf
            manuscript/sample.pdf
            labs-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
